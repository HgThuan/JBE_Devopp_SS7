name: Payment Service CI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ex03/payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

  build:
    name: Build & Upload JAR
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ex03/payment-service
    steps:
      # Job Isolation: each job runs on a fresh runner, so we must checkout code and setup Java 21 again
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-artifact
          path: Ex03/payment-service/build/libs/*.jar
          retention-days: 3
